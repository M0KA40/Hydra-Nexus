name: Bug report
description: Report a reproducible problem in Hydra Nexus.
title: "[Bug] "
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Hydra version, Nexus version and Windows version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: Describe the actions that trigger the problem.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Theme name and relevant error text. Remove account names, credentials and private files.
