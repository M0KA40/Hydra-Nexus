name: Clean published 4.1 source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/clean-4-1-source.yml']
permissions:
  contents: write
concurrency:
  group: nexus-4-1-source-cleanup
  cancel-in-progress: false
jobs:
  replace-source:
    if: github.repository == 'M0KA40/Hydra-Nexus' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare and verify the reviewed source archive
        run: python .release/clean-source-4-1.py prepare
      - name: Preserve the two original assets
        uses: actions/upload-artifact@v4
        with:
          name: previous-4-1-source-assets
          path: release-cleanup/previous/*
          if-no-files-found: error
          retention-days: 7
      - name: Replace and verify the two assets
        run: python .release/clean-source-4-1.py publish
