name: Refresh official 1.2.0
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  refresh:
    if: startsWith(github.event.head_commit.message, 'Refresh Hydra Nexus 1.2.0 revision 9')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - run: python tests/check.py
      - run: python release.py
      - name: Replace the explicitly authorized 1.2.0 assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Get-GitHubJson([string]$Endpoint) {
            $json = gh api $Endpoint
            if ($LASTEXITCODE -ne 0) { throw "GitHub read failed: $Endpoint" }
            return $json | ConvertFrom-Json
          }
          $version = node -p "require('./src/brand.cjs').version"
          $revision = node -p "require('./src/brand.cjs').revision"
          if ($version -cne '1.2.0' -or $revision -cne '9') { throw 'Unexpected release identity' }
          $repo = $env:GITHUB_REPOSITORY
          $release = Get-GitHubJson "repos/$repo/releases/tags/v1.2.0"
          if ($release.id -ne 422133804 -or $release.draft -or $release.prerelease) { throw 'Existing official release identity changed' }
          $main = Get-GitHubJson "repos/$repo/git/ref/heads/main"
          if ($main.object.sha -cne $env:GITHUB_SHA) { throw 'Main advanced; refusing stale publication' }
          $tag = Get-GitHubJson "repos/$repo/git/ref/tags/v1.2.0"
          $old = '07da22b6b7c68919b3d5afcaac0e2d189802b64c'
          if ($tag.object.sha -cne $old -and $tag.object.sha -cne $env:GITHUB_SHA) { throw 'Tag changed outside this replacement' }
          if ($release.body -notmatch '<!-- HYDRA_NEXUS_REVISION (7|9) -->') { throw 'Unexpected public revision' }
          if ($release.body -match '<!-- HYDRA_NEXUS_REVISION 9 -->' -and $tag.object.sha -cne $env:GITHUB_SHA) { throw 'A different revision 9 is already published' }
          $names = @('Hydra_Nexus.bat','Hydra-Nexus-1.2.0-source.zip','SHA256SUMS.txt')
          $paths = @($names | ForEach-Object { Join-Path 'dist' $_ })
          # Keep revision 7 in the notes until all replacement assets verify.
          # Clients reject a temporary payload/revision mismatch safely.
          gh release upload v1.2.0 @paths --clobber --repo $repo
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; do not advance public revision' }
          New-Item -ItemType Directory -Path 'dist/published-check' -Force | Out-Null
          foreach ($name in $names) {
            gh release download v1.2.0 --repo $repo --pattern $name --dir 'dist/published-check' --clobber
            if ($LASTEXITCODE -ne 0) { throw "Published download failed: $name" }
            $expected = (Get-FileHash -LiteralPath (Join-Path 'dist' $name) -Algorithm SHA256).Hash
            $actual = (Get-FileHash -LiteralPath (Join-Path 'dist/published-check' $name) -Algorithm SHA256).Hash
            if ($actual -cne $expected) { throw "Published hash mismatch: $name" }
            Write-Output "$name SHA-256 $actual"
          }
          $tag = Get-GitHubJson "repos/$repo/git/ref/tags/v1.2.0"
          if ($tag.object.sha -cne $old -and $tag.object.sha -cne $env:GITHUB_SHA) { throw 'Tag advanced during upload' }
          gh api --method PATCH "repos/$repo/git/refs/tags/v1.2.0" -f "sha=$env:GITHUB_SHA" -F force=true
          if ($LASTEXITCODE -ne 0) { throw 'Tag update failed' }
          gh release edit v1.2.0 --repo $repo --target $env:GITHUB_SHA --title 'Hydra Nexus 1.2.0' --notes-file 'docs/releases/1.2.0.md' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release metadata update failed' }
          $published = Get-GitHubJson "repos/$repo/releases/latest"
          if ($published.id -ne 422133804 -or $published.tag_name -cne 'v1.2.0' -or $published.body -notmatch '<!-- HYDRA_NEXUS_REVISION 9 -->') { throw 'Final official release verification failed' }
          Write-Output 'Existing official 1.2.0 release refreshed to internal revision 9.'
