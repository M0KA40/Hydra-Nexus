name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to create the release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'push' && github.event.head_commit.message == 'Release Hydra Nexus 2.2') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py --exe
      - run: python tests/check.py
      - name: Package checked release
        run: python release.py
      - name: Publish installer and patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./src/brand.cjs').version"
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; refusing to replace it." }
          gh release create "v$version" "dist/Hydra_Nexus_2.2.exe" "dist/Hydra_Nexus.bat" "dist/Hydra-Nexus-$version-source.zip" "dist/SHA256SUMS.txt" "dist/Hydra-Nexus-$version-release-notes.json" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Hydra Nexus 2.2" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Hide superseded release pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $releases = gh api --paginate "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tag_name -ne 'v2.2' -and -not $release.draft) {
              gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)" -F draft=true --silent
              if ($LASTEXITCODE -ne 0) { throw "Could not hide release $($release.tag_name)" }
            }
          }

  documentation:
    if: github.event_name == 'push' && github.event.head_commit.message == 'Restore Hydra Nexus documentation'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync documentation and release source
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v2.2 --repo "$env:GITHUB_REPOSITORY" --dir dist --pattern Hydra_Nexus_2.2.exe --pattern Hydra_Nexus.bat --pattern Hydra-Nexus-2.2-release-notes.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath dist/Hydra_Nexus_2.2.exe -Destination dist/Hydra_Nexus_Setup.exe
          python release.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload v2.2 dist/Hydra-Nexus-2.2-source.zip dist/SHA256SUMS.txt --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit v2.2 --notes-file docs/releases/2.2.md --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
