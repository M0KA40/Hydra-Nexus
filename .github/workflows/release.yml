name: Publish Hydra Nexus 4.0 fix
on:
  push:
    branches: [main]
    paths: ['.release/4.0-cloud-fix/request.json']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nexus-4-0-publication
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: M0KA40/Hydra-Nexus
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore verified 4.0 source and apply reviewed fix
        run: python .release/4.0-cloud-fix/publish.py prepare
      - name: Build native installer
        working-directory: release-work/Hydra-Nexus
        run: python build.py --exe
      - name: Check Cloud coordination, update safety and package
        run: python .release/4.0-cloud-fix/publish.py check
      - name: Preserve existing public assets
        uses: actions/upload-artifact@v4
        with:
          name: previous-public-4.0-assets
          path: release-work/previous/*
          retention-days: 30
          if-no-files-found: error
      - name: Publish and verify all five release assets
        run: python .release/4.0-cloud-fix/publish.py publish
