name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to create the release
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release Hydra Nexus ')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - run: python tests/check.py
      - name: Package checked release
        run: python release.py
      - name: Publish installer and patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./src/brand.cjs').version"
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; refusing to replace it." }
          gh release create "v$version" "dist/Hydra_Nexus.bat" "dist/Hydra-Nexus-$version-source.zip" "dist/SHA256SUMS.txt" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Hydra Nexus $version" --notes-file "docs/releases/$version.md" --latest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

