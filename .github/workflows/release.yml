name: Package native EXE
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py --exe
      - run: python tests/check.py
      - run: python release.py
      - uses: actions/upload-artifact@v4
        with:
          name: Hydra-Nexus-3.0
          path: |
            dist/Hydra_Nexus.exe
            dist/Hydra-Nexus-3.0-source.zip
            dist/Hydra-Nexus-3.0-release-notes.json
            dist/SHA256SUMS.txt
