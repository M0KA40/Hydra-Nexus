name: Release
on:
  push:
    branches: ['release/2.1.0']
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish-2.1 to publish the maintenance release while keeping 2.0 Latest
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/release/2.1.0' && github.event.head_commit.message == 'Release Hydra Nexus 2.1') || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'publish-2.1')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build.py
      - run: python tests/check.py
      - name: Package checked release
        run: python release.py
      - name: Publish installer and patch notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $version = node -p "require('./src/brand.cjs').version"
          if ($version -ne '2.1.0') { throw 'This workflow only publishes the 2.1 maintenance release.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne 'v2.0.0') { throw 'Expected v2.0.0 to be Latest; no release was created.' }
          gh release view "v$version" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) { throw "Release v$version already exists; refusing to replace it." }
          gh release create "v$version" "dist/Hydra_Nexus.bat" "dist/Hydra-Nexus-$version-source.zip" "dist/SHA256SUMS.txt" "dist/Hydra-Nexus-$version-release-notes.json" --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" --title "Hydra Nexus 2.1" --notes-file "docs/releases/$version.md" --draft --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit "v$version" --repo "$env:GITHUB_REPOSITORY" --draft=false --latest=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne 'v2.0.0') { throw 'Publication finished, but the Latest release must be inspected before delivery.' }
  promote-latest:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/2.1.0' && github.event.head_commit.message == 'Set Hydra Nexus 2.1 as latest'
    runs-on: ubuntu-latest
    steps:
      - name: Mark the existing 2.1 release as Latest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $before = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.1.0" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $before.draft -or $before.prerelease) { throw 'Expected the published stable v2.1.0 release.' }
          gh release edit v2.1.0 --repo "$env:GITHUB_REPOSITORY" --latest=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $after = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/v2.1.0" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $beforeAssets = $before.assets | Select-Object id,name,size,digest | ConvertTo-Json -Compress
          $afterAssets = $after.assets | Select-Object id,name,size,digest | ConvertTo-Json -Compress
          if ($before.body -cne $after.body -or $before.name -cne $after.name -or $beforeAssets -cne $afterAssets) { throw 'Release notes or assets unexpectedly changed.' }
          $latest = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq '.tag_name'
          if ($LASTEXITCODE -ne 0 -or $latest -ne 'v2.1.0') { throw 'v2.1.0 is not Latest.' }
