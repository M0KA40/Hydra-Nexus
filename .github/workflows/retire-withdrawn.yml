name: Retire withdrawn release
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  retire:
    if: startsWith(github.event.head_commit.message, 'Retire Hydra Nexus 1.2.1')
    runs-on: ubuntu-latest
    steps:
      - name: Remove the explicitly withdrawn release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete v1.2.1 --cleanup-tag --yes
          gh release edit v1.2.0 --latest
