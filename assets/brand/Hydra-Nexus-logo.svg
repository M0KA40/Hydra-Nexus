<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
 <linearGradient id="energy" x1="10%" y1="0%" x2="90%" y2="100%"><stop stop-color="#E7D9F7"/><stop offset=".48" stop-color="#BC9DE0"/><stop offset="1" stop-color="#8C6CAF"/></linearGradient>
