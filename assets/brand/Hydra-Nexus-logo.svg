<rect width="1024" height="1024" rx="216" fill="url(#back)"/><rect x="16" y="16" width="992" height="992" rx="200" fill="none" stroke="#302938" stroke-width="4"/><!-- One recognizable hydraulic knot: 3 sentient serpents joining one data core. -->
