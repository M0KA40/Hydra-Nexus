<path d="M304 420 253 426 209 396 197 350 224 308 277 292 322 316 341 360 329 393Z" fill="url(#energy)"/>
<path d="M720 420 771 426 815 396 827 350 800 308 747 292 702 316 683 360 695 393Z" fill="url(#energy)"/>
